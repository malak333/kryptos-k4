[package]
name = "kryptos-k4"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Source-grounded Kryptos K4 research CLI and constraint analyzer"
repository = "https://github.com/malak333/kryptos-k4"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
