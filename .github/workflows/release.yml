name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/kryptos-k4" dist/
          cp README.md LICENSE dist/
          tar -czf "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist .
          shasum -a 256 "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" > "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/kryptos-k4.exe" dist/
          Copy-Item README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $hash = Get-FileHash "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.zip" | Out-File -Encoding ascii "kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kryptos-k4-${{ matrix.target }}
          path: |
            kryptos-k4-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
